version: '3.1'

services:
  beds24_manager:
    container_name: beds24_app
    restart: unless-stopped
    environment:
      - BEDS24_REFRESH_TOKEN=${BEDS24_REFRESH_TOKEN}
      - NEXTAUTH_SECRET=${APP_SECRET}
      - NEXTAUTH_URL=https://app.gite-beaumont-saint-cyr.fr
      - DATABASE_URL=file:/app/data/auth.db
      - NODE_ENV=production
      - ALLOW_REGISTER=${ALLOW_REGISTER}
    volumes:
      - /var/beds24_manager_data:/app/data