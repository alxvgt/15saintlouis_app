version: '3.1'

services:
    beds24_manager:
        build: .
        command: sh -c "npm install && npm run dev"
        environment:
            - NODE_ENV=development
            - NEXTAUTH_URL=http://localhost:3000
        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next
        ports:
            - "3000:3000"